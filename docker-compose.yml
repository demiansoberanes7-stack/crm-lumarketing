# ============================================================
# LUMARK CRM — Producción: pull desde Docker Hub (sin build local)
# Optimizado para Azure B2ats v2 (1 GiB RAM + 2 GB swap)
#
# Uso:
#   1. Copia .env.example → .env y configura las variables
#   2. docker compose up -d
#
# La imagen se descarga de Docker Hub, no se compila en el VPS.
# El build ocurre en GitHub Actions al hacer push a main.
# ============================================================
services:
  app:
    image: ghostbreakfast69/lumark-crm:latest
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/lumark
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      CHANNELS: ${CHANNELS:-whatsapp,instagram,messenger}
      WHATSAPP_ZERNIO_ENABLED: ${WHATSAPP_ZERNIO_ENABLED:-}
      ZERNIO_BASE_URL: ${ZERNIO_BASE_URL:-https://zernio.com/api/v1}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-4.5}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-anthropic/claude-haiku-4.5}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      AGENDA: ${AGENDA:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      MAIN_URL: ${APP_BASE_URL}
      WAHA_TRUSTED_HOSTS: ${WAHA_TRUSTED_HOSTS:-}
      WEBHOOK_TRUSTED_HOSTS: ${WEBHOOK_TRUSTED_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data/media
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=96MB"
      - "-c"
      - "effective_cache_size=192MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=48MB"
      - "-c"
      - "wal_buffers=8MB"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumark
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  media_data:
