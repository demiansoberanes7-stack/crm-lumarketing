# MySQL local para desarrollo. Uso: docker compose -f docker-compose.dev.yml up -d
# `name` propio: evita colisionar con el proyecto del docker-compose.yml (Ruta B).
name: vocero-dev

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: vocero
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - vocero_dev_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vocero_dev_mysql:
