name: lumark-crm-local

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      APP_BASE_URL: http://localhost:3100
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/lumark
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      ALLOW_SIGNUP: "true"
      WA_MOCK_ENABLED: "true"
      META_GRAPH_BASE_URL: http://localhost:3000/api/dev/wa-mock
      OPENROUTER_BASE_URL: http://localhost:3000/api/dev/ai-mock
      CHANNELS: whatsapp,instagram,messenger
      MEDIA_DIR: /data/media
    volumes:
      - lumark_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumark
    volumes:
      - lumark_postgres_baseline:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lumark_media:
  lumark_postgres_baseline:
