# ============================================================
# LUMARK CRM — CI/CD: build + push Docker image a Docker Hub
# Se dispara al hacer push a la rama main.
# Compila en los servidores de GitHub (7 GB RAM gratis) para
# que el VPS (1 GiB) no tenga que compilar nada.
# ============================================================

name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite disparar manualmente desde GitHub

# Evita múltiples builds si llegan varios pushes rápidos
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: ghostbreakfast69/lumark-crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            GIT_SHA=${{ github.sha }}

      - name: Resumen del build
        run: |
          echo "✅ Imagen push a Docker Hub"
          echo "   Imagen: ${{ env.DOCKER_IMAGE }}"
          echo "   Tags: ${{ steps.meta.outputs.tags }}"
          echo "   Commit: ${{ github.sha }}"

      # ─── Deploy automático al VPS de Azure (SSH) ────────────
      - name: Deploy al servidor Azure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            python3 - <<'PY'
            from pathlib import Path

            path = Path(".env")
            overrides = {
                "OPENROUTER_BASE_URL": "https://openrouter.ai/api",
                "OPENROUTER_MODEL": "anthropic/claude-haiku-4.5",
                "OPENROUTER_JUDGE_MODEL": "anthropic/claude-haiku-4.5",
            }
            if path.exists():
                lines = path.read_text(encoding="utf-8").splitlines()
                updated = []
                seen = set()
                for line in lines:
                    key, separator, _ = line.partition("=")
                    if separator and key in overrides:
                        if key not in seen:
                            updated.append(f"{key}={overrides[key]}")
                            seen.add(key)
                    else:
                        updated.append(line)
                for key, value in overrides.items():
                    if key not in seen:
                        updated.append(f"{key}={value}")
                path.write_text("\n".join(updated).rstrip() + "\n", encoding="utf-8")
            PY
            echo "📦 Pulling nueva imagen desde Docker Hub..."
            docker compose pull app
            echo "🔄 Reiniciando contenedor (zero-downtime)..."
            docker compose up -d --no-deps app
            echo "🧹 Limpiando imágenes antiguas..."
            docker image prune -f
            echo "✅ Deploy completado — commit ${{ github.sha }}"
            echo "⏳ Esperando /api/health dentro del contenedor..."
            for attempt in $(seq 1 30); do
              if docker compose exec -T app wget -q -O- http://127.0.0.1:3000/api/health; then
                echo
                echo "✅ /api/health respondió correctamente"
                exit 0
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "❌ /api/health no estuvo disponible después de 60 segundos"
                docker compose ps
                exit 1
              fi
              sleep 2
            done
