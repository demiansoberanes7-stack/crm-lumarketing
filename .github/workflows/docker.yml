# ============================================================
# LUMARK CRM — CI/CD: build + push Docker image a Docker Hub
# Se dispara al hacer push a la rama main.
# Compila en los servidores de GitHub (7 GB RAM gratis) para
# que el VPS (1 GiB) no tenga que compilar nada.
# ============================================================

name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:  # permite disparar manualmente desde GitHub

# Evita múltiples builds si llegan varios pushes rápidos
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: ghostbreakfast69/lumark-crm

# El build solo necesita leer el repositorio; nada aquí escribe de vuelta en GitHub.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # Node declarado en vez de confiar en el que trae la imagen del runner:
      # si el gate dependiera de un binario que un día cambia, el fallo sería
      # «no se puede desplegar» sin que nada esté roto en el repo.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # El fallo de verdad de este pipeline no es que el build rompa: es que
      # rompa DOS MINUTOS DESPUÉS dentro del contenedor. `CMD = node migrate.mjs
      # && node server.js`, así que una entrada del journal sin su `.sql`
      # commiteado sube una imagen que no arranca y deja el sitio en crash loop
      # — con `latest` apuntando a algo inservible. `next build` no abre
      # `_journal.json`, nunca lo va a ver. Aquí sí. Sin node_modules: node + fs.
      - name: db:guard (migraciones coherentes antes de publicar)
        run: node scripts/check-migrations.mjs

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            GIT_SHA=${{ github.sha }}

      - name: Resumen del build
        run: |
          echo "✅ Imagen push a Docker Hub"
          echo "   Imagen: ${{ env.DOCKER_IMAGE }}"
          echo "   Tags: ${{ steps.meta.outputs.tags }}"
          echo "   Commit: ${{ github.sha }}"

      # El despliegue ya no sale de aquí: el CRM corre en Hostinger (Node.js)
      # y se publica con su propio build desde el panel, no con SSH a un VPS.
